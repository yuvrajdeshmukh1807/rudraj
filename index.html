<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Hotel Rudrajya — Authentic Maharashtrian & Kolhapuri Restaurant</title>
    <meta name="description" content="Welcome to Hotel Rudrajya — where culinary heritage meets authentic Maharashtrian flavors. Savor traditional Kolhapuri Misal, Pithla Bhakri, Tambda Pandhra Rassa, and Royal Thalis." />
    <meta name="keywords" content="Hotel Rudrajya, Maharashtrian restaurant, Kolhapuri food, authentic Maharashtrian thali, Misal Pav, Tambda Rassa, Pandhra Rassa, Pithla Bhakri, Puran Poli, Solkadhi, Indian restaurant" />
    <meta name="author" content="Hotel Rudrajya" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="restaurant.restaurant" />
    <meta property="og:title" content="Hotel Rudrajya — Authentic Maharashtrian & Kolhapuri Restaurant" />
    <meta property="og:description" content="Authentic Maharashtrian Taste, Served with Tradition. Hand-ground masalas, fiery Kolhapuri rassa, fresh jowar bhakris, and royal thalis." />
    <meta property="og:image" content="/restaurant-hero.jpg" />
    <meta property="og:url" content="https://hotelrudrajya.com" />
    <meta property="og:site_name" content="Hotel Rudrajya" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hotel Rudrajya — Authentic Maharashtrian & Kolhapuri Restaurant" />
    <meta name="twitter:description" content="Authentic Maharashtrian Taste, Served with Tradition. Explore our menu and reserve a table." />
    <meta name="twitter:image" content="/restaurant-hero.jpg" />

    <!-- Theme Color (Warm Maroon / Terracotta) -->
    <meta name="theme-color" content="#6b1d1d" />

    <!-- Google Fonts: Rozha One, Yatra One, Playfair Display, Inter, Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Rozha+One&family=Yatra+One&display=swap"
      rel="stylesheet"
    />

    <!-- Preload hero food image -->
    <link rel="preload" as="image" href="/restaurant-hero.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Structured Data for Restaurant -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "Hotel Rudrajya",
      "image": "/restaurant-hero.jpg",
      "description": "Authentic Maharashtrian & Kolhapuri Restaurant offering traditional thalis, Misal Pav, Pithla Bhakri, and signature Tambda Pandhra Rassa.",
      "url": "https://hotelrudrajya.com",
      "telephone": "+91 98220 00000",
      "servesCuisine": ["Maharashtrian", "Kolhapuri", "Indian"],
      "priceRange": "₹₹",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Near Main Highway",
        "addressLocality": "Maharashtra",
        "addressCountry": "IN"
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "11:30",
          "closes": "15:30"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "19:00",
          "closes": "23:00"
        }
      ],
      "acceptsReservations": "True"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
